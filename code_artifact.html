<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 관리 애플리케이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* 스크롤바 숨기기 (디자인 목적) */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e5e7eb;
            border: 1px solid #e5e7eb;
        }
        .calendar-cell {
            background-color: #ffffff;
            height: 110px; /* 고정 크기 */
            overflow: hidden; /* 넘치는 내용 숨김 */
            display: flex;
            flex-direction: column;
        }
        .calendar-cell.empty-cell {
            cursor: pointer;
        }
        .calendar-cell.empty-cell:hover {
            background-color: #f9fafb;
        }
        .calendar-cell.has-tasks {
            cursor: pointer;
        }
        .calendar-cell.has-tasks:hover {
            background-color: #f0fdf4;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-20">

    <div class="max-w-3xl mx-auto pt-8 px-4 sm:px-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">나의 일정</h1>
                <p id="todayDateText" class="text-sm text-gray-500 mt-1"></p>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full font-medium shadow-lg shadow-blue-500/30 transition-all transform hover:scale-105 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                할 일 추가
            </button>
        </header>

        <!-- 오늘 할 일 섹션 -->
        <section class="mb-10">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">오늘 할 일</h2>
            <div id="todayEmpty" class="hidden bg-white rounded-2xl p-8 text-center shadow-sm border border-gray-100">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-50 text-blue-500 mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <p class="text-gray-500">오늘 계획된 일정이 없습니다.<br>편안한 하루 보내세요!</p>
            </div>
            <ul id="todayTasksList" class="space-y-3">
                <!-- 오늘 일정 렌더링 -->
            </ul>
        </section>

        <!-- 모든 할 일 섹션 -->
        <section>
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">모든 할 일</h2>
                <div class="flex bg-gray-200 rounded-lg p-1 space-x-1">
                    <button id="viewListBtn" onclick="switchView('list')" class="px-3 py-1.5 rounded-md text-sm font-medium bg-white text-gray-800 shadow-sm transition-colors">목록</button>
                    <button id="viewCalBtn" onclick="switchView('calendar')" class="px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-300 transition-colors">달력</button>
                </div>
            </div>

            <!-- 목록 뷰 필터 -->
            <div id="listFilterContainer" class="flex space-x-2 mb-4">
                <button onclick="setListFilter('all')" id="filter-all" class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-600 text-white shadow-sm transition-colors">전체</button>
                <button onclick="setListFilter('completed')" id="filter-completed" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">완료</button>
                <button onclick="setListFilter('incomplete')" id="filter-incomplete" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">미완료</button>
            </div>

            <!-- 목록 뷰 -->
            <div id="allTasksListContainer">
                <div id="allEmpty" class="hidden bg-white rounded-2xl p-8 text-center shadow-sm border border-gray-100">
                    <p class="text-gray-500">등록된 일정이 없습니다.</p>
                </div>
                <ul id="allTasksList" class="space-y-3">
                    <!-- 모든 일정 렌더링 -->
                </ul>
            </div>

            <!-- 달력 뷰 -->
            <div id="calendarContainer" class="hidden bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="changeMonth(-1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                    <h3 id="calendarMonthYear" class="text-lg font-bold text-gray-800"></h3>
                    <button onclick="changeMonth(1)" class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                </div>
                <div class="grid grid-cols-7 gap-1 mb-2">
                    <div class="text-center text-xs font-semibold text-red-500">일</div>
                    <div class="text-center text-xs font-semibold text-gray-500">월</div>
                    <div class="text-center text-xs font-semibold text-gray-500">화</div>
                    <div class="text-center text-xs font-semibold text-gray-500">수</div>
                    <div class="text-center text-xs font-semibold text-gray-500">목</div>
                    <div class="text-center text-xs font-semibold text-gray-500">금</div>
                    <div class="text-center text-xs font-semibold text-blue-500">토</div>
                </div>
                <div id="calendarGrid" class="calendar-grid rounded-lg overflow-hidden">
                    <!-- 달력 렌더링 -->
                </div>
            </div>
        </section>
    </div>

    <!-- ================= MODALS ================= -->

    <!-- 1. 할 일 추가/수정 모달 (z-[60]) -->
    <div id="addEditModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[60] backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="addEditModalContent">
            <h2 id="addEditModalTitle" class="text-xl font-bold text-gray-800 mb-4">할 일 추가</h2>
            <input type="hidden" id="task-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">제목</label>
                    <input type="text" id="task-title" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-2.5 border" placeholder="일정 제목을 입력하세요">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">일자</label>
                    <input type="date" id="task-date" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-2.5 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">내용</label>
                    <textarea id="task-desc" rows="3" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-2.5 border resize-none" placeholder="상세 내용을 입력하세요"></textarea>
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeAddEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">취소</button>
                <button onclick="saveTask()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors">저장</button>
            </div>
        </div>
    </div>

    <!-- 2. 상세 보기 모달 (z-[60]) -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[60] backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200" id="detailModalContent">
            <!-- Header -->
            <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-start">
                <div>
                    <span id="detail-date-badge" class="inline-block px-2.5 py-1 rounded-md text-xs font-semibold bg-blue-100 text-blue-700 mb-2"></span>
                    <h2 id="detail-title" class="text-xl font-bold text-gray-900 break-words"></h2>
                </div>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 transition-colors p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- Body -->
            <div class="p-6">
                <p id="detail-desc" class="text-gray-700 whitespace-pre-wrap text-sm leading-relaxed"></p>
                <input type="hidden" id="detail-id">
            </div>
            <!-- Footer -->
            <div class="bg-gray-50 px-6 py-4 border-t flex justify-end gap-2 flex-wrap">
                <button onclick="editTaskFromDetail()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">수정</button>
                <button id="detail-status-btn" onclick="toggleStatusFromDetail()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg transition-colors">완료로 변경</button>
                <button onclick="openConfirmModal()" class="px-4 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">취소(삭제)</button>
            </div>
        </div>
    </div>

    <!-- 3. 일별 일정 목록 모달 (z-[50]) -->
    <div id="dailyTasksModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[50] backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl w-full max-w-md mx-4 shadow-2xl flex flex-col max-h-[80vh] transform scale-95 transition-transform duration-200" id="dailyTasksModalContent">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl">
                <h2 id="dailyTasksTitle" class="text-lg font-bold text-gray-800"></h2>
                <div class="flex items-center gap-2">
                    <!-- 해당 날짜용 할 일 추가 버튼 -->
                    <button id="dailyAddBtn" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="이 날짜에 할 일 추가">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                    <button onclick="closeDailyTasksModal()" class="text-gray-400 hover:text-gray-600 p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">
                <ul id="dailyTasksList" class="space-y-3">
                    <!-- 리스트 인젝션 -->
                </ul>
            </div>
        </div>
    </div>

    <!-- 4. 취소(삭제) 확인 모달 (z-[70]) -->
    <div id="confirmModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-[70] transition-opacity opacity-0">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="confirmModalContent">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4">
                    <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">정말 취소(삭제)하시겠습니까?</h3>
                <p class="text-sm text-gray-500 mb-6">이 작업은 되돌릴 수 없습니다.</p>
                <div class="flex justify-center space-x-3">
                    <button onclick="closeConfirmModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors w-full">아니오</button>
                    <button onclick="confirmDeleteTask()" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm transition-colors w-full">예</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === 상태 관리 ===
        let tasks = [];
        let currentView = 'list'; // 'list' | 'calendar'
        let currentListFilter = 'all'; // 'all' | 'completed' | 'incomplete'
        let currentDate = new Date();
        let currentDailyTasksDate = null; // dailyTasksModal이 열려있는 날짜 추적

        // === 초기화 ===
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('todo_tasks');
            if (saved) tasks = JSON.parse(saved);

            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('todayDateText').innerText = today.toLocaleDateString('ko-KR', options);

            renderTasks();
        });

        // === 유틸리티 ===
        function saveToLocalStorage() {
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        }

        function getTodayString() {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(Date.now() - tzoffset)).toISOString().split('T')[0];
        }

        // === 모달 제어 함수 (애니메이션 포함) ===
        function showModal(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // setTimeout for transition to work
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function hideModal(modalId, contentId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById(contentId);
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        // 1. 할 일 추가/수정 모달
        function openAddModal(dateStr = '') {
            document.getElementById('task-id').value = '';
            document.getElementById('task-title').value = '';
            document.getElementById('task-desc').value = '';
            document.getElementById('task-date').value = dateStr || getTodayString();
            document.getElementById('addEditModalTitle').innerText = '할 일 추가';
            showModal('addEditModal', 'addEditModalContent');
        }

        function openEditModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-desc').value = task.desc;
            document.getElementById('task-date').value = task.date;
            document.getElementById('addEditModalTitle').innerText = '할 일 수정';
            showModal('addEditModal', 'addEditModalContent');
        }

        function closeAddEditModal() { hideModal('addEditModal', 'addEditModalContent'); }

        // 2. 상세 보기 모달
        function openDetailModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            
            document.getElementById('detail-id').value = task.id;
            document.getElementById('detail-title').innerText = task.title;
            document.getElementById('detail-title').className = `text-xl font-bold break-words ${task.completed ? 'text-gray-400 line-through' : 'text-gray-900'}`;
            document.getElementById('detail-desc').innerText = task.desc || '내용이 없습니다.';
            document.getElementById('detail-date-badge').innerText = task.date;
            
            const statusBtn = document.getElementById('detail-status-btn');
            if(task.completed) {
                statusBtn.innerText = '미완료로 변경';
            } else {
                statusBtn.innerText = '완료로 변경';
            }

            showModal('detailModal', 'detailModalContent');
        }
        function closeDetailModal() { hideModal('detailModal', 'detailModalContent'); }

        function editTaskFromDetail() {
            const id = document.getElementById('detail-id').value;
            closeDetailModal();
            setTimeout(() => openEditModal(id), 200); // 닫히는 애니메이션 후 열기
        }

        function toggleStatusFromDetail() {
            const id = document.getElementById('detail-id').value;
            const task = tasks.find(t => t.id === id);
            if(task) {
                task.completed = !task.completed;
                saveToLocalStorage();
                renderTasks();
                openDetailModal(id); // 모달 내용 갱신
            }
        }

        // 3. 일별 일정 목록 모달
        function openDailyTasksModal(dateStr) {
            currentDailyTasksDate = dateStr;
            const dayTasks = tasks.filter(t => t.date === dateStr);
            document.getElementById('dailyTasksTitle').innerText = `${dateStr} 일정`;
            
            const btn = document.getElementById('dailyAddBtn');
            btn.onclick = () => openAddModal(dateStr);

            renderDailyTasksList(dayTasks);
            showModal('dailyTasksModal', 'dailyTasksModalContent');
        }
        function closeDailyTasksModal() { 
            currentDailyTasksDate = null;
            hideModal('dailyTasksModal', 'dailyTasksModalContent'); 
        }

        function renderDailyTasksList(dayTasks) {
            const listEl = document.getElementById('dailyTasksList');
            listEl.innerHTML = '';
            if (dayTasks.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">일정이 없습니다.</p>';
                return;
            }
            // 일자순이 아니라 등록순 또는 완료여부로 정렬 가능. 여기선 그냥 노출
            dayTasks.forEach(task => {
                listEl.appendChild(createTaskCard(task));
            });
        }

        // 4. 취소(삭제) 확인 모달
        function openConfirmModal(idParam = null) {
            // 상세모달에서 호출 시 id 파라미터가 없으므로 detail-id에서 가져옴
            const id = idParam || document.getElementById('detail-id').value;
            document.getElementById('confirmModal').setAttribute('data-target-id', id);
            showModal('confirmModal', 'confirmModalContent');
        }
        function closeConfirmModal() { hideModal('confirmModal', 'confirmModalContent'); }

        function confirmDeleteTask() {
            const id = document.getElementById('confirmModal').getAttribute('data-target-id');
            tasks = tasks.filter(t => t.id !== id);
            saveToLocalStorage();
            renderTasks();
            closeConfirmModal();
            closeDetailModal();
        }

        // === CRUD 로직 ===
        function saveTask() {
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title').value.trim();
            const date = document.getElementById('task-date').value;
            const desc = document.getElementById('task-desc').value.trim();

            if (!title || !date) {
                alert('제목과 일자를 입력해주세요.'); // 시스템 Alert 최소화 요구였으나 폼검증용
                return;
            }

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.date = date;
                    task.desc = desc;
                }
            } else {
                tasks.push({
                    id: Date.now().toString(),
                    title,
                    date,
                    desc,
                    completed: false
                });
            }

            saveToLocalStorage();
            closeAddEditModal();
            renderTasks();
        }

        function toggleTaskStatus(id, event) {
            if(event) event.stopPropagation(); // 버블링 방지
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveToLocalStorage();
                renderTasks();
            }
        }

        // === 뷰 및 필터 제어 ===
        function switchView(view) {
            currentView = view;
            const listBtn = document.getElementById('viewListBtn');
            const calBtn = document.getElementById('viewCalBtn');
            const listContainer = document.getElementById('allTasksListContainer');
            const calContainer = document.getElementById('calendarContainer');
            const filterContainer = document.getElementById('listFilterContainer');

            if (view === 'list') {
                listBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium bg-white text-gray-800 shadow-sm transition-colors';
                calBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-300 transition-colors';
                listContainer.classList.remove('hidden');
                filterContainer.classList.remove('hidden');
                calContainer.classList.add('hidden');
            } else {
                calBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium bg-white text-gray-800 shadow-sm transition-colors';
                listBtn.className = 'px-3 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-300 transition-colors';
                calContainer.classList.remove('hidden');
                listContainer.classList.add('hidden');
                filterContainer.classList.add('hidden');
                renderCalendar();
            }
        }

        function setListFilter(filter) {
            currentListFilter = filter;
            const activeClass = 'px-4 py-1.5 rounded-full text-sm font-medium bg-blue-600 text-white shadow-sm transition-colors';
            const inactiveClass = 'px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors';
            
            document.getElementById('filter-all').className = filter === 'all' ? activeClass : inactiveClass;
            document.getElementById('filter-completed').className = filter === 'completed' ? activeClass : inactiveClass;
            document.getElementById('filter-incomplete').className = filter === 'incomplete' ? activeClass : inactiveClass;
            
            renderTasks();
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        // === 렌더링 코어 ===
        function createTaskCard(task) {
            const li = document.createElement('li');
            li.className = `flex items-start bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow cursor-pointer ${task.completed ? 'opacity-75' : ''}`;
            li.onclick = () => openDetailModal(task.id);

            li.innerHTML = `
                <button onclick="toggleTaskStatus('${task.id}', event)" class="mt-0.5 mr-3 flex-shrink-0 text-${task.completed ? 'blue-500' : 'gray-300'} hover:text-blue-600 transition-colors focus:outline-none">
                    <svg class="w-6 h-6" fill="${task.completed ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${task.completed ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}"></path>
                    </svg>
                </button>
                <div class="flex-grow min-w-0">
                    <h3 class="text-base font-semibold truncate ${task.completed ? 'text-gray-400 line-through' : 'text-gray-800'}">${task.title}</h3>
                    <p class="text-sm text-gray-500 truncate mt-0.5">${task.desc || '내용 없음'}</p>
                </div>
                <div class="ml-3 flex-shrink-0 text-right">
                    <span class="inline-block px-2.5 py-1 rounded-md text-xs font-medium bg-gray-100 text-gray-600">${task.date}</span>
                </div>
            `;
            return li;
        }

        function renderTasks() {
            const todayStr = getTodayString();
            const todayTasksList = document.getElementById('todayTasksList');
            const allTasksList = document.getElementById('allTasksList');
            const todayEmpty = document.getElementById('todayEmpty');
            const allEmpty = document.getElementById('allEmpty');

            todayTasksList.innerHTML = '';
            allTasksList.innerHTML = '';

            // 1. 오늘 할 일
            const todayTasks = tasks.filter(t => t.date === todayStr);
            if (todayTasks.length === 0) {
                todayEmpty.classList.remove('hidden');
            } else {
                todayEmpty.classList.add('hidden');
                todayTasks.forEach(t => todayTasksList.appendChild(createTaskCard(t)));
            }

            // 2. 모든 할 일 (목록 뷰)
            let filteredTasks = tasks;
            if (currentListFilter === 'completed') filteredTasks = tasks.filter(t => t.completed);
            if (currentListFilter === 'incomplete') filteredTasks = tasks.filter(t => !t.completed);

            if (filteredTasks.length === 0) {
                allEmpty.classList.remove('hidden');
            } else {
                allEmpty.classList.add('hidden');
                // 일자순 정렬 (오름차순)
                const sorted = [...filteredTasks].sort((a, b) => new Date(a.date) - new Date(b.date));
                sorted.forEach(t => allTasksList.appendChild(createTaskCard(t)));
            }

            // 3. 달력 뷰 업데이트
            if (currentView === 'calendar') {
                renderCalendar();
            }

            // 4. Daily Modal 갱신 (열려있을 경우)
            if (currentDailyTasksDate) {
                const dayTasks = tasks.filter(t => t.date === currentDailyTasksDate);
                renderDailyTasksList(dayTasks);
                if (dayTasks.length === 0 && !document.getElementById('dailyTasksModal').classList.contains('hidden')) {
                    // 일정이 모두 지워졌으면 모달 닫기
                    closeDailyTasksModal();
                }
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('calendarMonthYear').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            const startDayIndex = firstDay.getDay(); 
            const totalDays = lastDay.getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 빈 칸(이전 달)
            for (let i = 0; i < startDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-cell bg-gray-50';
                grid.appendChild(emptyDiv);
            }

            // 날짜 렌더링
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayTasks = tasks.filter(t => t.date === dateStr);
                
                const cell = document.createElement('div');
                cell.className = 'calendar-cell p-1 sm:p-2 flex flex-col relative';
                
                if (dayTasks.length === 0) {
                    cell.classList.add('empty-cell');
                    cell.onclick = () => openAddModal(dateStr);
                } else {
                    cell.classList.add('has-tasks');
                    cell.onclick = () => openDailyTasksModal(dateStr);
                }

                // 날짜 숫자
                const dateNum = document.createElement('div');
                dateNum.className = 'text-xs font-medium text-gray-700 mb-1 text-right px-1';
                
                // 오늘 날짜 하이라이트
                if (dateStr === getTodayString()) {
                    dateNum.innerHTML = `<span class="bg-blue-500 text-white rounded-full w-5 h-5 inline-flex items-center justify-center">${day}</span>`;
                } else {
                    dateNum.innerText = day;
                    // 일요일 빨강, 토요일 파랑
                    const currentWeekDay = new Date(year, month, day).getDay();
                    if(currentWeekDay === 0) dateNum.classList.add('text-red-500');
                    if(currentWeekDay === 6) dateNum.classList.add('text-blue-500');
                }
                cell.appendChild(dateNum);

                // 일정 뱃지 (최대 2개)
                const maxTasks = 2;
                dayTasks.slice(0, maxTasks).forEach(task => {
                    const badge = document.createElement('div');
                    badge.className = `text-[10px] sm:text-xs truncate px-1.5 py-0.5 mb-1 rounded-sm ${task.completed ? 'bg-gray-100 text-gray-400 line-through' : 'bg-blue-50 text-blue-700 border border-blue-100'}`;
                    badge.innerText = task.title;
                    cell.appendChild(badge);
                });

                // '+N 더보기'
                if (dayTasks.length > maxTasks) {
                    const more = document.createElement('div');
                    more.className = 'text-[10px] text-gray-500 font-medium px-1 mt-auto';
                    more.innerText = `+${dayTasks.length - maxTasks} 더보기`;
                    cell.appendChild(more);
                }

                grid.appendChild(cell);
            }
        }
    </script>
</body>
</html>
