<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 관리 애플리케이션</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 커스텀 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">일정 관리</h1>
                <p id="headerDate" class="text-gray-500 mt-1"></p>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-full font-medium shadow-md transition-colors flex items-center gap-2">
                <span>+ 할 일 추가</span>
            </button>
        </div>

        <!-- 오늘 할 일 Section -->
        <section class="mb-10 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full"></span> 오늘 할 일
            </h2>
            <div id="todayEmpty" class="text-center py-8 text-gray-400 hidden">
                <p>오늘 예정된 할 일이 없습니다.</p>
            </div>
            <ul id="todayTasksList" class="space-y-3"></ul>
        </section>

        <!-- 모든 할 일 Section -->
        <section class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span class="w-2 h-2 bg-blue-500 rounded-full"></span> 모든 할 일
                </h2>
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="btnListView" onclick="switchView('list')" class="px-4 py-1.5 rounded-md text-sm font-medium bg-white shadow-sm text-blue-600 transition-all">목록으로 보기</button>
                    <button id="btnCalendarView" onclick="switchView('calendar')" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">달력으로 보기</button>
                </div>
            </div>

            <!-- 목록 뷰 필터 -->
            <div id="listFilters" class="flex gap-2 mb-4">
                <button id="filter-all" onclick="setListFilter('all')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-600 text-white shadow-sm transition-colors">전체</button>
                <button id="filter-completed" onclick="setListFilter('completed')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">완료</button>
                <button id="filter-incomplete" onclick="setListFilter('incomplete')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors">미완료</button>
            </div>

            <!-- 목록 뷰 -->
            <div id="listView">
                <div id="allEmpty" class="text-center py-12 text-gray-400 hidden bg-gray-50 rounded-xl border border-dashed border-gray-200">
                    <p>등록된 할 일이 없습니다.</p>
                </div>
                <ul id="allTasksList" class="space-y-3"></ul>
            </div>

            <!-- 달력 뷰 -->
            <div id="calendarView" class="hidden">
                <div class="flex justify-between items-center mb-4 px-2">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 font-bold">&lt;</button>
                    <h3 id="calendarMonthLabel" class="text-lg font-bold text-gray-800"></h3>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 font-bold">&gt;</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-medium text-sm text-gray-500 mb-2">
                    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
                </div>
                <!-- auto-rows 고정 크기 (가로세로 비율 유지) -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 auto-rows-[90px] sm:auto-rows-[110px]"></div>
            </div>
        </section>
    </div>

    <!-- 1. 할 일 추가/수정 모달 -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[60] opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform m-4">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-800">새로운 할 일</h2>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
            </div>
            <form id="taskForm" onsubmit="handleTaskSubmit(event)">
                <input type="hidden" id="taskId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">할 일 제목</label>
                        <input type="text" id="taskTitle" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">일자</label>
                        <input type="date" id="taskDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">내용</label>
                        <textarea id="taskDesc" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">취소</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 상세 모달 -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[60] opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform m-4 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-start mb-4 relative">
                <div class="pr-8">
                    <span id="detailDate" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 mb-2 inline-block"></span>
                    <h2 id="detailTitle" class="text-2xl font-bold text-gray-800 break-words"></h2>
                </div>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none absolute top-0 right-0">&times;</button>
            </div>
            <div class="bg-gray-50 rounded-xl p-4 mb-6 flex-grow overflow-y-auto">
                <p id="detailDesc" class="text-gray-700 whitespace-pre-wrap break-words"></p>
            </div>
            <div class="flex justify-end gap-2 mt-auto">
                <button id="btnDetailEdit" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition-colors text-sm">수정</button>
                <button id="btnDetailToggle" class="px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg font-medium transition-colors text-sm">상태변경</button>
                <button id="btnDetailDelete" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-medium transition-colors text-sm">취소(삭제)</button>
            </div>
        </div>
    </div>

    <!-- 3. 삭제 확인 모달 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[70] opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl transform scale-95 transition-transform m-4 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4 text-xl">!</div>
            <h3 class="text-lg font-bold text-gray-900 mb-2">일정 취소</h3>
            <p class="text-gray-500 mb-6">정말로 이 할 일을 취소(삭제)하시겠습니까?<br>이 작업은 되돌릴 수 없습니다.</p>
            <div class="flex justify-center gap-3">
                <button id="btnConfirmNo" class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-medium transition-colors">아니오</button>
                <button id="btnConfirmYes" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors">예, 삭제합니다</button>
            </div>
        </div>
    </div>

    <!-- 4. 일별 일정 목록 모달 (달력 클릭) -->
    <div id="dailyTasksModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[50] opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl transform scale-95 transition-transform m-4 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-5 border-b pb-4">
                <h2 id="dailyTasksTitle" class="text-lg font-bold text-gray-800"></h2>
                <div class="flex gap-2 items-center">
                    <button id="btnDailyAdd" class="text-sm px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg font-medium transition-colors">+ 추가</button>
                    <button onclick="closeDailyTasksModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
                </div>
            </div>
            <div class="overflow-y-auto pr-1">
                <ul id="dailyTasksList" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <!-- 외부 자바스크립트 연결 -->
    <script src="app.js"></script>
</body>
</html>
